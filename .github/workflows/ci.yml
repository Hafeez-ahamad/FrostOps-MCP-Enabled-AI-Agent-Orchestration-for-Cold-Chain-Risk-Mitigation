name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, type check, offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    name: Integration tests (SQL Server 2022)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Generate throwaway database passwords
        run: |
          for name in MSSQL_SA_PASSWORD SQL_AGENT_PASSWORD SQL_INGEST_PASSWORD SQL_CONSOLE_PASSWORD \
                      SQL_MONITOR_PASSWORD SQL_PLANNER_PASSWORD SQL_GATE_PASSWORD SQL_EXECUTOR_PASSWORD; do
            value="Aa1!$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Start SQL Server
        run: |
          docker run -d --name mssql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
                 -P "$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" -o /dev/null; then
              echo "SQL Server is up"; exit 0
            fi
            sleep 2
          done
          docker logs mssql; exit 1
      - name: Install ODBC Driver 18 if missing
        run: |
          if ! odbcinst -q -d -n "ODBC Driver 18 for SQL Server" > /dev/null 2>&1; then
            # The runner image usually has Microsoft's apt repo already; only add it if absent.
            if ! grep -rqs "packages.microsoft.com" /etc/apt/sources.list /etc/apt/sources.list.d; then
              curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
                | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
              curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" \
                | sudo tee /etc/apt/sources.list.d/mssql-release.list
            fi
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi
      - run: pip install -r requirements-dev.txt
      - name: Integration tests
        run: |
          set -o pipefail
          pytest -m integration -q -rf --tb=short 2>&1 | tee integration.log
      - name: Show the failure summary as an annotation
        if: failure()
        run: |
          msg=$(tail -c 3000 integration.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=integration tests::${msg}"
